#:schema node_modules/wrangler/config-schema.json
name = "aritra"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Bind a D1 Database. For more info: https://developers.cloudflare.com/pages/platform/functions/#d1-databases
[[d1_databases]]
binding = "DB"                               # This MUST remain "DB" as it is used in lib/db.ts
database_name = "aritra"            # The name of the database you created in Cloudflare Dashboard
database_id = "2ecb16b1-bbce-47d9-8dbd-2e413ea5bac9"    # Replace this with your actual D1 Database ID from the dashboard
